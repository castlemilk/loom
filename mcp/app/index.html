<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Loom graph browser</title>
<style>
  :root { color-scheme: light dark; --ink: #22342a; --paper: #f8f6ee; --rule: #b9c1b2; --copper: #864122; }
  @media (prefers-color-scheme: dark) { :root { --ink: #e6ece1; --paper: #1e2d24; --rule: #647667; --copper: #ffb683; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 system-ui,sans-serif; }
  main { max-width: 52rem; margin: auto; padding: clamp(16px,4vw,40px); }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--rule); }
  header strong, .measure { font: 12px/1.5 ui-monospace,monospace; }
  h1 { margin: 18px 0 12px; font: normal clamp(27px,5vw,48px)/1.1 Georgia,serif; overflow-wrap: anywhere; }
  p { margin: 8px 0; }
  #search { display: grid; gap: 10px; margin-block: 15px; }
  .field { display: grid; gap: 4px; }
  input, select, button { color: inherit; background: var(--paper); border: 1px solid var(--rule); border-radius: 3px; padding: 8px 10px; font: inherit; }
  button, a { cursor: pointer; } button:focus-visible, a:focus-visible { outline: 2px solid var(--copper); outline-offset: 2px; }
  #search button { justify-self: start; background: var(--ink); color: var(--paper); }
  ul { list-style: none; margin: 0; padding: 0; }
  li button { width: 100%; text-align: left; border-width: 0 0 1px; border-radius: 0; }
  li button:hover { text-decoration: underline; } a { color: var(--copper); }
  pre { color: var(--copper); font: bold 14px/1 ui-monospace,monospace; }
  blockquote { margin: 15px 0; padding-left: 15px; border-left: 2px solid var(--copper); }
  [hidden], #search[hidden] { display: none; }
</style></head>
<body><main><header><strong>Loom / Graph MCP</strong><button id="browse" hidden>Browse graphs</button></header>
  <h1 id="heading">Graph browser</h1>
  <section id="search" aria-label="Node search" hidden><div class="field"><label for="graphs">Graph</label><select id="graphs"></select></div>
    <div class="field"><label for="query">Find a node</label><input id="query" required maxlength="250" type="search" placeholder="Node name or ID"></div>
    <button id="find" type="button" disabled>Find nodes</button></section>
  <p id="status" class="measure" role="status">Connecting to Graph MCP…</p>
  <ul id="choices" aria-label="Graph results"></ul>
  <section id="connection" hidden><pre aria-hidden="true">[o]--------&gt;[o]</pre>
    <blockquote id="excerpt" hidden></blockquote><a id="source" hidden target="_blank" rel="noreferrer">Open archived source</a></section>
</main><script src="app.js"></script></body></html>
