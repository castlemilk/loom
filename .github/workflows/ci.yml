name: Loom
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:types
      - run: npm test
      - run: npm run size
      - run: npm run test:browser
        env:
          LOOM_BROWSER_CHANNEL: chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: artifacts/
  performance:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, loom-perf]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npm run size
      - run: npx playwright install chromium
      - run: npm run bench
        env:
          LOOM_HEADFUL: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hardware-performance
          path: artifacts/performance.json
