name: Graph studio on Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: loom-pages
  cancel-in-progress: true

env:
  LOOM_BROWSER_CHANNEL: chrome

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm --prefix web ci
      - run: npm run build && npm run test:types && npm test && npm run size
      - run: npm run site:build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: npm run test:site
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-views
          path: artifacts/studio/
          if-no-files-found: ignore
          retention-days: 5
      - run: printf '%s\n' "$GITHUB_SHA" > web/out/revision.txt
      - uses: actions/upload-artifact@v4
        with:
          name: studio-export
          path: web/out
          include-hidden-files: true
          retention-days: 1

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.publish.outputs.url }}
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
      - uses: actions/download-artifact@v4
        with:
          name: studio-export
          path: export
      - name: Publish the tested export from gh-pages
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Checkout and artifact extraction can give different, equal-size files
          # identical timestamps. Compare bytes before skipping any published file.
          rsync -a --checksum --delete --exclude=.git --exclude=/packages/ export/ published/
          test "$(cat published/revision.txt)" = "$GITHUB_SHA"
          mkdir -p "published/packages/$GITHUB_SHA"
          cp export/loom-core-*.tgz "published/packages/$GITHUB_SHA/"
          git -C published add --all
          if ! git -C published diff --cached --quiet; then
            git -C published -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "Publish studio from $GITHUB_SHA"
            git -C published push origin HEAD:gh-pages
          fi
          endpoint="repos/$GITHUB_REPOSITORY/pages"
          gh api --method POST "$endpoint/builds" --silent
          url=$(gh api "$endpoint" --jq .html_url)
          echo "url=$url" >> "$GITHUB_OUTPUT"

  verify:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      PAGES_URL: ${{ needs.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Wait for this revision on the public site
        run: |
          for attempt in {1..36}; do
            if [[ "$(curl -fsSL --max-time 8 "${PAGES_URL%/}/revision.txt?sha=$GITHUB_SHA&attempt=$attempt")" == "$GITHUB_SHA" ]]; then
              exit 0
            fi
            sleep 5
          done
          echo "Timed out waiting for $GITHUB_SHA at $PAGES_URL" >&2
          exit 1
      - run: npm run test:site -- "$PAGES_URL"
      - name: Install the published archive and typecheck a consumer
        run: |
          consumer_dir=$(mktemp -d)
          cp tests/public-api.ts "$consumer_dir/consumer.mts"
          npm install --prefix "$consumer_dir" --ignore-scripts --no-audit --no-fund "${PAGES_URL%/}/packages/$GITHUB_SHA/loom-core-0.1.0.tgz"
          node_modules/.bin/tsc --strict --noEmit --target ES2022 --module NodeNext --moduleResolution NodeNext "$consumer_dir/consumer.mts"
          cd "$consumer_dir"
          node --input-type=module <<'JS'
          import { createGraph } from 'loom-core'
          import { observePerformance } from 'loom-core/performance'
          import { compileTaxonomies } from 'loom-core/taxonomy'
          if (typeof createGraph !== 'function' || typeof observePerformance !== 'function' ||
              !compileTaxonomies({ nodes: [], links: [] }, { taxonomies: [] }).legend) process.exit(1)
          JS
