name: Graph studio on Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: loom-pages
  cancel-in-progress: true

env:
  LOOM_BROWSER_CHANNEL: chrome

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm --prefix web ci
      - run: npm run build && npm test && npm run size
      - run: npm run site:build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: npm run test:site
      - run: printf '%s\n' "$GITHUB_SHA" > web/out/revision.txt
      - uses: actions/upload-artifact@v4
        with:
          name: studio-export
          path: web/out
          include-hidden-files: true
          retention-days: 1

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.publish.outputs.url }}
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
      - uses: actions/download-artifact@v4
        with:
          name: studio-export
          path: export
      - name: Publish the tested export from gh-pages
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rsync -a --delete --exclude=.git export/ published/
          git -C published add --all
          if ! git -C published diff --cached --quiet; then
            git -C published -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "Publish studio from $GITHUB_SHA"
            git -C published push origin HEAD:gh-pages
          fi
          endpoint="repos/$GITHUB_REPOSITORY/pages"
          gh api --method POST "$endpoint/builds" --silent
          url=$(gh api "$endpoint" --jq .html_url)
          echo "url=$url" >> "$GITHUB_OUTPUT"

  verify:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      PAGES_URL: ${{ needs.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Wait for this revision on the public site
        run: |
          for attempt in {1..36}; do
            if [[ "$(curl -fsSL --max-time 8 "${PAGES_URL%/}/revision.txt?sha=$GITHUB_SHA")" == "$GITHUB_SHA" ]]; then
              exit 0
            fi
            sleep 5
          done
          echo "Timed out waiting for $GITHUB_SHA at $PAGES_URL" >&2
          exit 1
      - run: npm run test:site -- "$PAGES_URL"
